name: release

# Теговый релиз проходит четыре границы: проверка происхождения коммита,
# сборка без секретов, подпись в защищённом environment и публикация. Job с
# Apple-секретами не checkout'ит репозиторий и не запускает его скрипты.
# Ручной запуск намеренно остаётся только неподписанным пробным прогоном.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Любые неуказанные права GITHUB_TOKEN отключены. Право писать Releases есть
# только у publish; Apple-секреты принадлежат environment `release`.
permissions:
  contents: read

jobs:
  validate_release:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.provenance.outputs.commit_sha }}
      version: ${{ steps.metadata.outputs.version }}
      previous_tag: ${{ steps.metadata.outputs.previous_tag }}
    steps:
      - name: Тег указывает на проверенный коммит default branch
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] \
            || { echo "::error::недопустимое имя релизного тега: $TAG"; exit 1; }

          # GitHub обычно передаёт EVENT_SHA как peeled commit, а API refs для
          # annotated tag возвращает tag-object SHA. Принимаем обе документные
          # формы, но только если текущий ref всё ещё разрешается в тот же объект
          # или тот же commit.
          REF_SHA="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          COMMIT_SHA="$(gh api "repos/$REPOSITORY/commits/$TAG" --jq .sha)"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::не удалось разрешить тег в commit SHA"; exit 1; }
          if [ "$EVENT_SHA" != "$REF_SHA" ] && [ "$EVENT_SHA" != "$COMMIT_SHA" ]; then
            echo "::error::тег изменился после запуска workflow"
            exit 1
          fi

          # Если default branch совпадает с тегом или находится впереди него,
          # теговый коммит входит в историю ветки. behind/diverged запрещены.
          STATUS="$(gh api "repos/$REPOSITORY/compare/$COMMIT_SHA...$DEFAULT_BRANCH" --jq .status)"
          case "$STATUS" in
            identical|ahead) ;;
            *)
              echo "::error::тег $TAG ($COMMIT_SHA) не входит в $DEFAULT_BRANCH (compare: $STATUS)"
              exit 1
              ;;
          esac

          # Ровно этот SHA должен был успешно пройти push-run основного CI на
          # default branch. Тег, поставленный до зелёной сборки, не выпускается.
          RUNS="$RUNNER_TEMP/build-runs.json"
          gh api --method GET "repos/$REPOSITORY/actions/workflows/build.yml/runs" \
            -f head_sha="$COMMIT_SHA" -f event=push -f status=completed -f per_page=100 > "$RUNS"
          CI_URL="$(jq -r --arg branch "$DEFAULT_BRANCH" --arg sha "$COMMIT_SHA" '
            [.workflow_runs[]
             | select(.head_branch == $branch and .head_sha == $sha and .conclusion == "success")]
            | first | .html_url // empty
          ' "$RUNS")"
          test -n "$CI_URL" || {
            echo "::error::для $COMMIT_SHA нет успешного push-run build.yml на $DEFAULT_BRANCH"
            exit 1
          }

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "проверенный CI: $CI_URL"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.provenance.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Версия, тег и заметки согласованы
        id: metadata
        env:
          COMMIT_SHA: ${{ steps.provenance.outputs.commit_sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION=//p' Scripts/version)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] \
            || { echo "::error::недопустимая VERSION: $VERSION"; exit 1; }
          test "$TAG" = "v$VERSION" \
            || { echo "::error::тег $TAG, а в Scripts/version $VERSION"; exit 1; }
          test -f "docs/releases/$VERSION.md" \
            || { echo "::error::нет docs/releases/$VERSION.md"; exit 1; }
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"

          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v*' "$COMMIT_SHA^" 2>/dev/null || true)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS" >> "$GITHUB_OUTPUT"

  # Репозиторий и его скрипты исполняются здесь, где Apple-секретов нет.
  # Подписывающий job получает только архив уже собранного .app.
  build_candidate:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: validate_release
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate_release.outputs.commit_sha }}
          persist-credentials: false

      - name: Собрать неподписанный кандидат
        env:
          CODESIGN_IDENTITY: '-'
        run: ./Scripts/bundle.sh release

      - name: Упаковать только данные для подписывающего job
        env:
          COMMIT_SHA: ${{ needs.validate_release.outputs.commit_sha }}
          VERSION: ${{ needs.validate_release.outputs.version }}
        run: |
          set -euo pipefail
          test -x build/Cyclop.app/Contents/MacOS/Cyclop
          test -f "docs/releases/$VERSION.md"
          mkdir -p build/release-input
          ditto -c -k --keepParent build/Cyclop.app build/release-input/Cyclop-app.zip
          cp "docs/releases/$VERSION.md" build/release-input/release-notes.md
          printf '%s\n' "$COMMIT_SHA" > build/release-input/commit-sha
          printf '%s\n' "$VERSION" > build/release-input/version
          (
            cd build/release-input
            shasum -a 256 Cyclop-app.zip release-notes.md commit-sha version > SOURCE_SHA256SUMS
          )

      - name: Передать кандидат без секретов
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cyclop-${{ needs.validate_release.outputs.version }}-unsigned-candidate
          if-no-files-found: error
          retention-days: 1
          path: build/release-input/

  # Защищённый environment останавливает job до одобрения ревьюером. Здесь нет
  # checkout и нет вызова файлов из репозитория: только системные signing tools.
  sign_release:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [validate_release, build_candidate]
    runs-on: macos-15
    environment:
      name: release
    permissions:
      contents: read
    steps:
      - name: Повторно проверить неизменность тега
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.validate_release.outputs.commit_sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          test "$CURRENT_SHA" = "$EXPECTED_SHA" \
            || { echo "::error::тег изменился после проверки происхождения"; exit 1; }

      - name: Скачать неподписанный кандидат
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Cyclop-${{ needs.validate_release.outputs.version }}-unsigned-candidate
          path: release-input

      - name: Проверить целостность и форму кандидата
        env:
          EXPECTED_SHA: ${{ needs.validate_release.outputs.commit_sha }}
          EXPECTED_VERSION: ${{ needs.validate_release.outputs.version }}
        run: |
          set -euo pipefail
          cd release-input
          shasum -a 256 -c SOURCE_SHA256SUMS
          test "$(cat commit-sha)" = "$EXPECTED_SHA"
          test "$(cat version)" = "$EXPECTED_VERSION"

          # The candidate is deliberately untrusted until the protected
          # reviewer approves it. Reject traversal, links, devices, oversized
          # archives and every path outside the one expected app before ditto
          # is allowed to write anything.
          /usr/bin/python3 - <<'PY'
          import pathlib, stat, sys, zipfile
          archive = pathlib.Path("Cyclop-app.zip")
          if archive.stat().st_size > 100 * 1024 * 1024:
              raise SystemExit("compressed archive is too large")
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              if not infos or len(infos) > 2000:
                  raise SystemExit("invalid archive entry count")
              if sum(i.file_size for i in infos) > 200 * 1024 * 1024:
                  raise SystemExit("archive is too large")
              seen = set()
              for info in infos:
                  name = info.filename
                  if info.orig_filename != name:
                      raise SystemExit("archive path contains a NUL byte")
                  pure = pathlib.PurePosixPath(name)
                  if (not name or "\\" in name or pure.is_absolute() or
                          any(part in ("", ".", "..") for part in pure.parts) or
                          not (pure == pathlib.PurePosixPath("Cyclop.app") or
                               str(pure).startswith("Cyclop.app/"))):
                      raise SystemExit(f"unsafe archive path: {name!r}")
                  folded = str(pure).casefold()
                  if folded in seen:
                      raise SystemExit(f"duplicate archive path: {name!r}")
                  seen.add(folded)
                  mode = info.external_attr >> 16
                  kind = stat.S_IFMT(mode)
                  if kind not in (0, stat.S_IFREG, stat.S_IFDIR):
                      raise SystemExit(f"unsafe archive entry type: {name!r}")
          PY
          mkdir extracted
          ditto -x -k Cyclop-app.zip extracted
          APP=extracted/Cyclop.app
          test -x "$APP/Contents/MacOS/Cyclop"
          test -f "$APP/Contents/Resources/libcyclopmedia.dylib"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = com.cyclop.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$EXPECTED_VERSION"
          if find "$APP" -type l -print -quit | grep -q .; then
            echo "::error::в Cyclop.app неожиданная символическая ссылка"
            exit 1
          fi

      - name: Импортировать ключи во временную связку
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${P12_BASE64:?нет environment secret DEVELOPER_ID_P12}"
          : "${P12_PASSWORD:?нет environment secret DEVELOPER_ID_P12_PASSWORD}"
          : "${NOTARY_KEY_BASE64:?нет environment secret NOTARY_KEY_P8}"

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          chmod 600 "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENTITY" \
            || { echo "::error::в .p12 нет Developer ID Application"; exit 1; }
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Подписать, нотаризовать и собрать DMG
        env:
          VERSION: ${{ needs.validate_release.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${NOTARY_KEY_ID:?нет environment secret NOTARY_KEY_ID}"
          : "${NOTARY_ISSUER_ID:?нет environment secret NOTARY_ISSUER_ID}"
          APP="$GITHUB_WORKSPACE/release-input/extracted/Cyclop.app"
          DMG="$GITHUB_WORKSPACE/release-input/Cyclop-$VERSION.dmg"

          # Entitlements заданы в доверенном workflow, а не берутся из
          # загруженного артефакта.
          ENTITLEMENTS="$RUNNER_TEMP/Cyclop.entitlements"
          cat > "$ENTITLEMENTS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.automation.apple-events</key><true/>
            <key>com.apple.security.personal-information.calendars</key><true/>
          </dict></plist>
          PLIST

          notarize_and_staple() {
            local submitted="$1" staple_target="${2:-$1}" out request_id status
            out="$(xcrun notarytool submit "$submitted" \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" --wait --output-format json)"
            request_id="$(printf '%s' "$out" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            status="$(printf '%s' "$out" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            xcrun notarytool log "$request_id" \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" 2>/dev/null \
              | /usr/bin/python3 -c 'import json,sys
          for issue in (json.load(sys.stdin).get("issues") or []):
              print("    {}: {}: {}".format(issue.get("severity"), issue.get("path"), issue.get("message")))' \
              || true
            test "$status" = Accepted \
              || { echo "::error::нотаризация: $status (id $request_id)"; exit 1; }
            xcrun stapler staple -q "$staple_target"
            xcrun stapler validate -q "$staple_target"
          }

          xattr -cr "$APP"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" \
            "$APP/Contents/Resources/libcyclopmedia.dylib"
          codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" \
            --sign "$CODESIGN_IDENTITY" "$APP"
          codesign --verify --strict --deep "$APP"

          APP_ZIP="$RUNNER_TEMP/Cyclop-$VERSION.zip"
          ditto -c -k --keepParent "$APP" "$APP_ZIP"
          notarize_and_staple "$APP_ZIP" "$APP"
          rm -f "$APP_ZIP"

          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          cp -R "$APP" "$STAGE/Cyclop.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Cyclop $VERSION" -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -quiet "$DMG"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "$DMG"
          notarize_and_staple "$DMG"

          codesign --verify --strict "$APP"
          codesign --verify --strict "$DMG"
          spctl -a -vv "$APP"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          (
            cd release-input
            shasum -a 256 "Cyclop-$VERSION.dmg" > SHA256SUMS
          )

      - name: Удалить временные ключи
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/Cyclop.entitlements"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security lock-keychain "$KEYCHAIN"
            security delete-keychain "$KEYCHAIN"
          fi

      - name: Передать подписанный релиз
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cyclop-${{ needs.validate_release.outputs.version }}-signed-release
          if-no-files-found: error
          retention-days: 1
          path: |
            release-input/Cyclop-${{ needs.validate_release.outputs.version }}.dmg
            release-input/SHA256SUMS
            release-input/release-notes.md

  publish:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [validate_release, sign_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Проверить тег перед публикацией
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.validate_release.outputs.commit_sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          test "$CURRENT_SHA" = "$EXPECTED_SHA" \
            || { echo "::error::тег изменился после подписи"; exit 1; }

      - name: Скачать подписанный релиз
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Cyclop-${{ needs.validate_release.outputs.version }}-signed-release
          path: release-input

      - name: Проверить контрольную сумму после передачи
        working-directory: release-input
        run: sha256sum -c SHA256SUMS

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate_release.outputs.version }}
          PREVIOUS_TAG: ${{ needs.validate_release.outputs.previous_tag }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          DMG="release-input/Cyclop-$VERSION.dmg"
          NOTE_ARGS=(-f "tag_name=$TAG")
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTE_ARGS+=(-f "previous_tag_name=$PREVIOUS_TAG")
          fi
          GENERATED="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${NOTE_ARGS[@]}" --jq '.body' 2>/dev/null || true)"
          BODY="$(mktemp)"
          cp release-input/release-notes.md "$BODY"
          SUM="$(cut -d' ' -f1 release-input/SHA256SUMS)"
          printf '\n\n**SHA-256** `%s`\n\nПроверить: `shasum -a 256 Cyclop-%s.dmg`\n' \
            "$SUM" "$VERSION" >> "$BODY"
          [ -n "$GENERATED" ] && printf '\n\n---\n\n%s\n' "$GENERATED" >> "$BODY"
          gh release create "$TAG" "$DMG" --title "Cyclop $VERSION" \
            --notes-file "$BODY" --latest
          gh release view "$TAG" --json url --jq .url

  # workflow_dispatch никогда не связывается с environment `release` и не
  # ссылается на Apple-секреты. Это только проверка сборки и упаковки.
  dry_run:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Проверить версию
        id: metadata
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION=//p' Scripts/version)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Неподписанный пробный DMG
        env:
          CODESIGN_IDENTITY: '-'
          NOTARIZE: '0'
        run: ./Scripts/dmg.sh

      - name: Контрольная сумма
        run: |
          cd build
          shasum -a 256 "Cyclop-$VERSION.dmg" > SHA256SUMS

      - name: Сохранить пробный образ
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cyclop-${{ steps.metadata.outputs.version }}-dry-run
          if-no-files-found: error
          path: |
            build/Cyclop-${{ steps.metadata.outputs.version }}.dmg
            build/SHA256SUMS
